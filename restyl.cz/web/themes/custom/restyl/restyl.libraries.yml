global:
  css:
    theme:
      'https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500&display=swap':
        type: external
      css/style.css: {}
  js:
    js/navigation.js: {}
    js/hero-video.js: {}
    js/homepage-animations.js: {}

leaflet:
  css:
    theme:
      'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css':
        type: external
  js:
    'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js':
      type: external
      attributes:
        defer: true

location-map:
  css:
    theme:
      css/location-map.css: {}
  js:
    js/location-map.js:
      attributes:
        defer: true
  dependencies:
    - core/drupal
    - core/once
    - restyl/leaflet
